name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install disposable database test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
      - name: Install browser for synthetic application test
        run: python -m playwright install --with-deps chromium
      - name: Run tests
        env:
          REQUIRE_ACCOUNT_SQL_TESTS: "1"
          JOB_HUNTER_TEST_CHROME: bundled
        run: ./tool/check.sh
