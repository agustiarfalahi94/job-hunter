[project]
name = "job-hunter"
version = "1.3.0"
description = "Local-first job matching and application planning assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agustiar Falahi" }]
dependencies = [
    "streamlit>=1.41.0",
]

[project.scripts]
job-hunter = "job_hunter.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
