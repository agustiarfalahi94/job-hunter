[project]
name = "job-hunter"
version = "1.18.4"
description = "Local-first job matching and application planning assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agustiar Falahi" }]
dependencies = [
    "Authlib>=1.8.0,<2",
    "beautifulsoup4>=4.12.0",
    "cryptography>=50.0.1,<51",
    "google-genai>=1.75.0,<2",
    "pandas>=2.2.0",
    "pycountry>=24.6.1",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "requests>=2.32.0",
    "streamlit==1.63.0",
]

[project.scripts]
job-hunter = "job_hunter.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
