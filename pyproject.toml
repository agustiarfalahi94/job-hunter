[project]
name = "job-hunter"
version = "1.9.0"
description = "Local-first job matching and application planning assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Agustiar Falahi" }]
dependencies = [
    "beautifulsoup4>=4.12.0",
    "pandas>=2.2.0",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "requests>=2.32.0",
    "streamlit>=1.41.0",
]

[project.scripts]
job-hunter = "job_hunter.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
